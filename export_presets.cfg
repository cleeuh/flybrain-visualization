[preset.0]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="data/*.bmesh, data/*.mm, data/*.bin, data/*.json"
exclude_filter="data/raw/*"
export_path="build/godot-fly.x86_64"

[preset.0.options]

binary_format/architecture="x86_64"
; Self-contained binary: the pack is appended to the executable, so there is no separate
; .pck to lose in transit (a missing / mismatched one is the "Couldn't load project data"
; error at startup).
binary_format/embed_pck=true

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
; Plain data files are not "resources": without this filter the build runs on the dev
; machine and shows an empty scene on the wall (same lesson as satwatch2).
include_filter="data/*.bmesh, data/*.mm, data/*.bin, data/*.json"
exclude_filter="data/raw/*"
export_path="build/godot-fly.exe"
script_export_mode=2

[preset.1.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/modify_resources=false
application/product_name="godot-fly"
application/file_description="Stereoscopic Drosophila connectome visualization"
application/company_name="godot-fly"
